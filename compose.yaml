name: web-fetch-proxy

services:
  fetch-worker:
    build:
      context: ./services/fetch-worker
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      PROXY_LISTEN_ADDR: 0.0.0.0:8081
      FETCH_AUTH_TOKEN_FILE: /run/secrets/fetch_auth_token
      LOG_FILE: /var/log/fetch-worker/worker.log
      DEFAULT_TIMEOUT_MS: ${DEFAULT_TIMEOUT_MS:-30000}
      MAX_TIMEOUT_MS: ${MAX_TIMEOUT_MS:-60000}
      CONNECT_TIMEOUT_MS: ${CONNECT_TIMEOUT_MS:-5000}
      RESPONSE_HEADER_TIMEOUT_MS: ${RESPONSE_HEADER_TIMEOUT_MS:-15000}
      DEFAULT_MAX_BYTES: ${DEFAULT_MAX_BYTES:-10485760}
      HARD_MAX_BYTES: ${HARD_MAX_BYTES:-52428800}
      DEFAULT_MAX_REDIRECTS: ${DEFAULT_MAX_REDIRECTS:-5}
      HARD_MAX_REDIRECTS: ${HARD_MAX_REDIRECTS:-10}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-100}
      BLOCKED_CIDRS: ${BLOCKED_CIDRS:-}
      ALLOWED_UPSTREAM_HOSTS: ${ALLOWED_UPSTREAM_HOSTS:-}
      PROXY_MAX_CONCURRENCY: ${PROXY_MAX_CONCURRENCY:-50}
      PROXY_MAX_STREAM_BYTES: ${PROXY_MAX_STREAM_BYTES:-104857600}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-}
    secrets:
      - fetch_auth_token
    volumes:
      - ./var/log/fetch-worker:/var/log/fetch-worker
    expose:
      - "8080"
      - "8081"
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    cpus: ${WORKER_CPU_LIMIT:-1.0}
    pids_limit: 128
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      fetch-worker:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-127.0.0.1}
      ALLOWED_CLIENT_CIDR: ${ALLOWED_CLIENT_CIDR:-0.0.0.0/0}
      # 只替换模板里的 SERVER_NAME，避免 envsubst 改写 Nginx 自身的 $变量。
      NGINX_ENVSUBST_FILTER: ^(SERVER_NAME|ALLOWED_CLIENT_CIDR)$
    ports:
      # Fail closed when no .env is supplied: local/default Compose runs bind only to loopback.
      # cloudctl init explicitly writes 0.0.0.0 for a production deployment.
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_HTTPS_PORT:-8443}:443"
    networks:
      - edge
      - backend
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./var/pki/ca.crt:/etc/nginx/tls/ca.crt:ro
      - ./var/pki/server.crt:/etc/nginx/tls/server.crt:ro
      - ./var/pki/server.key:/etc/nginx/tls/server.key:ro
      - ./var/log/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O - http://fetch-worker:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    cpus: ${NGINX_CPU_LIMIT:-0.5}
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  fetch_auth_token:
    file: ./var/secrets/fetch_auth_token

networks:
  edge:
    name: web-fetch-proxy-edge
  backend:
    name: web-fetch-proxy-backend
    internal: true
  egress:
    name: web-fetch-proxy-egress
